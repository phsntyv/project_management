<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CSV Importer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>Importation dynamique de CSV</h1>
        <p class="subtitle">Sélectionnez un fichier CSV — le tableau s'adapte automatiquement aux colonnes.</p>
    </header>

    <main id="main-content" class="fullscreen-ready">
        <section class="uploader">
            <form id="upload-form">
                <label for="file" class="file-label">
                    <span id="file-name">Choisir un fichier CSV…</span>
                    <input type="file" id="file" name="file" accept=".csv" required>
                </label>
                <button type="submit">Envoyer</button>
            </form>
            <div id="message" class="message hidden"></div>
        </section>

        <section class="preview hidden" id="preview">
            <div class="quality-report hidden" id="quality-report">
                <h2 id="report-title"></h2>
                <p id="report-summary"></p>
                <div id="report-details"></div>
            </div>

            <div class="meta">
                <span id="meta-file"></span>
                <span id="meta-count"></span>
            </div>
            <div class="table-wrapper">
                <table id="data-table">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
